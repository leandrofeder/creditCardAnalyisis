<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#080810" />
  <title>Dashboard Financeiro 💳</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💳</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@600;700;800&display=swap" rel="stylesheet" />

  <script crossorigin src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prop-types@15/prop-types.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/recharts@2.12.7/umd/Recharts.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; -webkit-text-size-adjust: 100%; }
    body { background: #080810; overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
    #root { min-height: 100dvh; }

    ::-webkit-scrollbar { width: 3px; height: 3px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 99px; }

    @keyframes spin    { to { transform: rotate(360deg); } }
    @keyframes fadeUp  { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
    @keyframes fadeIn  { from { opacity:0; } to { opacity:1; } }
    @keyframes slideUp { from { transform:translateY(100%); } to { transform:translateY(0); } }
    @keyframes pulse   { 0%,100%{opacity:.4} 50%{opacity:1} }

    .fade-up   { animation: fadeUp  .3s ease both; }
    .fade-in   { animation: fadeIn  .2s ease both; }
    .slide-up  { animation: slideUp .3s cubic-bezier(.16,1,.3,1) both; }
    .pulse     { animation: pulse 1.4s ease-in-out infinite; }

    /* Active states for touch */
    .tap-target { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    .tap-target:active { opacity: .7; }
    .card-tap:active  { transform: scale(.98); }
    .btn-tap:active   { transform: scale(.96); }

    /* Bottom nav */
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 200;
      background: #0a0a14;
      border-top: 1px solid #0f172a;
      display: flex;
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    .nav-btn {
      flex: 1; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 3px;
      padding: 10px 4px 8px;
      border: none; background: transparent;
      color: #334155; font-family: 'DM Mono', monospace;
      font-size: 9px; letter-spacing: .04em;
      cursor: pointer; transition: color .15s;
      -webkit-tap-highlight-color: transparent;
    }
    .nav-btn.active { color: #818cf8; }
    .nav-btn .icon { font-size: 20px; line-height: 1; }

    /* Drawer overlay */
    .drawer-overlay {
      position: fixed; inset: 0; z-index: 300;
      background: rgba(0,0,0,.7);
      backdrop-filter: blur(4px);
      animation: fadeIn .2s ease both;
    }
    .drawer {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 301;
      background: #0e0e1a;
      border-radius: 20px 20px 0 0;
      border-top: 1px solid #1e293b;
      padding: 0 0 env(safe-area-inset-bottom, 16px);
      animation: slideUp .3s cubic-bezier(.16,1,.3,1) both;
      max-height: 85dvh;
      overflow-y: auto;
    }
    .drawer-handle {
      width: 36px; height: 4px; border-radius: 99px;
      background: #1e293b; margin: 12px auto 16px;
    }

    /* Inputs & selects */
    input, select, button { font-family: 'DM Mono', monospace; }
    input:focus, select:focus { outline: none; }
    select { -webkit-appearance: none; appearance: none; }

    /* Scrollable horizontal chips */
    .chip-scroll {
      display: flex; gap: 8px; overflow-x: auto;
      padding: 2px 4px; scrollbar-width: none;
    }
    .chip-scroll::-webkit-scrollbar { display: none; }
    .chip {
      flex-shrink: 0; padding: 6px 12px; border-radius: 99px;
      border: 1px solid #1e293b; background: #0f172a;
      color: #475569; font-size: 11px; cursor: pointer;
      white-space: nowrap; transition: all .15s;
      -webkit-tap-highlight-color: transparent;
    }
    .chip.active { background: #4f46e522; border-color: #4f46e5; color: #818cf8; }
    .chip:active { opacity: .7; }

    /* Transaction card */
    .txn-card {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 16px;
      border-bottom: 1px solid #0a0a14;
      background: #0c0c18;
      transition: background .08s;
      -webkit-tap-highlight-color: transparent;
    }
    .txn-card:active { background: #0f172a; }

    /* Progress bar */
    .prog-bar { height: 3px; border-radius: 99px; background: #0f172a; overflow: hidden; }
    .prog-fill { height: 100%; border-radius: 99px; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useMemo, useRef, useEffect, useCallback } = React;

if (typeof Recharts === "undefined") {
  document.getElementById("root").innerHTML =
    '<div style="color:#ef4444;font-family:monospace;padding:40px;text-align:center">' +
    '⚠️ Erro: biblioteca Recharts não carregou.<br/>Verifique sua conexão com a internet e recarregue a página.</div>';
  throw new Error("Recharts not loaded");
}

const {
  BarChart, Bar, LineChart, Line, PieChart, Pie, Cell,
  XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer, Legend
} = Recharts;

// ─── CONSTANTS ───────────────────────────────
const fmt = v => `R$ ${Math.abs(v).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2})}`;
const fmtShort = v => {
  const n = Math.abs(v);
  if(n>=1000) return `R$${(n/1000).toFixed(1)}k`;
  return `R$${n.toFixed(0)}`;
};

const CAT_COLORS = {
  "Supermercado":"#22c55e","Gastronomia":"#f97316","Transporte":"#3b82f6",
  "Tecnologia/Assinaturas":"#8b5cf6","Compras Online":"#06b6d4","Gasolina":"#eab308",
  "Saúde":"#ec4899","Padaria/Alimentação":"#a78bfa","Academia/Saúde":"#14b8a6",
  "Cafés/Pequenos":"#fb923c","Parcelamentos":"#64748b","Encargos/Juros":"#ef4444",
  "Pagamento":"#10b981","Estacionamento":"#94a3b8","Presentes/Bazar":"#f43f5e",
  "Educação":"#0ea5e9","Telecomunicações":"#38bdf8","Seguros":"#d97706","Outros":"#6b7280",
};
const CARD_COLORS = { Nubank:"#8c52ff", Ailos:"#00a86b", Inter:"#ff6b00" };

function categorize(title) {
  const t = title.toLowerCase();
  if(t.includes("uber")||t.includes("99app")) return "Transporte";
  if(t.includes("fitland") || t.includes("54656637adan") || t.includes("koch")||t.includes("supermercado")||t.includes("sams club")||t.includes("hipermercado")||t.includes("cooper")||t.includes("mercado garcia")||t.includes("cs koch")) return "Supermercado";
  if(t.includes("farmacia")||t.includes("saude")||t.includes("otica")||t.includes("medic")) return "Saúde";
  if(t.includes("academia")) return "Academia/Saúde";
  if(t.includes("apple")||t.includes("microsoft")||t.includes("canva")||t.includes("hostgator")||t.includes("applecombill")) return "Tecnologia/Assinaturas";
  if(t.includes("amazon")||t.includes("shopee")||t.includes("mercadolivre")) return "Compras Online";
  if(t.includes("posto")||t.includes("gasolina")||t.includes("zandona")||t.includes("autopost")) return "Gasolina";
  if(t.includes("restaurant")||t.includes("takumi")||t.includes("toscana")||t.includes("boli")||t.includes("ohana")||t.includes("acai")||t.includes("sushi")||t.includes("brunch")||t.includes("bier")||t.includes("ecke")||t.includes("fogao")||t.includes("pasteis")||t.includes("napoli")||t.includes("kalzone")||t.includes("baitah")||t.includes("divino")||t.includes("sitio")||t.includes("allesblau")||t.includes("frogpay")||t.includes("polaco")||t.includes("dinho")) return "Gastronomia";
  if(t.includes("padaria")||t.includes("panificadora")||t.includes("girassol")||t.includes("royale")||t.includes("dona norma")) return "Padaria/Alimentação";
  if(t.includes("cafe vending")||t.includes("aromapress")||t.includes("raiden")||t.includes("cappta")) return "Cafés/Pequenos";
  if(t.includes("pagamento recebido")) return "Pagamento";
  if(t.includes("parcela")||t.includes("siapi")||t.includes("panasonic")||t.includes("prata fina")||t.includes("isabela")||t.includes("s v comercio")) return "Parcelamentos";
  if(t.includes("juros")||t.includes("multa")||t.includes("iof")||t.includes("saldo em")||t.includes("rotativo")||t.includes("mora")) return "Encargos/Juros";
  if(t.includes("estacionamento")) return "Estacionamento";
  if(t.includes("bazar")||t.includes("reuter")||t.includes("tecnofesta")||t.includes("milium")||t.includes("cacau")) return "Presentes/Bazar";
  if(t.includes("leiturinha")||t.includes("escola")||t.includes("rede top")) return "Educação";
  if(t.includes("vivo")||t.includes("intercel")||t.includes("rcga")) return "Telecomunicações";
  if(t.includes("allianz")||t.includes("seguro")) return "Seguros";
  return "Outros";
}

// ─── PARSERS ─────────────────────────────────
function parseCSV(text, filename) {
  const lines = text.trim().split(/\r?\n/).slice(1);
  const m = filename.match(/(\d{4}-\d{2})/);
  const label = m
    ? new Date(m[1]+"-01").toLocaleDateString("pt-BR",{month:"short",year:"numeric"}).replace(".","")
    : filename.replace(/\.[^.]+$/,"");
  return lines.map(line => {
    // Handle quoted CSV fields properly
    const parts = [];
    let cur = "", inQ = false;
    for(let i=0;i<line.length;i++){
      const ch = line[i];
      if(ch==='"'){ inQ=!inQ; }
      else if(ch===','&&!inQ){ parts.push(cur); cur=""; }
      else{ cur+=ch; }
    }
    parts.push(cur);
    if(parts.length<3) return null;
    const date   = parts[0].trim();
    const amount = parseFloat(parts[parts.length-1].trim().replace(",","."));
    const title  = parts.slice(1,parts.length-1).join(",").trim().replace(/^"|"$/g,"");
    if(!date||isNaN(amount)) return null;
    return {date,title,amount,card:"Nubank",month:label,category:categorize(title)};
  }).filter(Boolean);
}

async function loadPdfJs() {
  if(window.pdfjsLib) return;
  await new Promise((res,rej)=>{
    const s=document.createElement("script");
    s.src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
    s.onload=res; s.onerror=rej; document.head.appendChild(s);
  });
  window.pdfjsLib.GlobalWorkerOptions.workerSrc=
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
}

async function parsePDF(file) {
  await loadPdfJs();
  const buf = await file.arrayBuffer();
  const pdf = await window.pdfjsLib.getDocument({data:buf}).promise;
  let text = "";
  for(let p=1;p<=pdf.numPages;p++){
    const page=await pdf.getPage(p);
    const content=await page.getTextContent();
    text+=content.items.map(i=>i.str).join(" ")+"\n";
  }
  const fname=file.name.toLowerCase();
  const isAilos=fname.includes("fatura_")||text.includes("AILOS")||text.includes("VIACREDI");
  const isInter=fname.includes("inter")||text.includes("Banco Inter")||text.includes("bancointer");
  const card=isAilos?"Ailos":isInter?"Inter":"PDF";
  const yearMatch=text.match(/20\d{2}/);
  const year=yearMatch?.[0]||new Date().getFullYear().toString();
  const mMatch=text.match(/fatura de (\w+)/i);
  const ptMap={janeiro:"Jan",fevereiro:"Fev",março:"Mar",marco:"Mar",abril:"Abr",maio:"Mai",junho:"Jun",julho:"Jul",agosto:"Ago",setembro:"Set",outubro:"Out",novembro:"Nov",dezembro:"Dez"};
  const rawM=mMatch?.[1]?.toLowerCase()||"";
  const monthLabel=(ptMap[rawM]||rawM||file.name.replace(/\.[^.]+$/,""))+"/"+year;
  const txns=[];
  const ptNum={JAN:"01",FEV:"02",MAR:"03",ABR:"04",MAI:"05",JUN:"06",JUL:"07",AGO:"08",SET:"09",OUT:"10",NOV:"11",DEZ:"12"};
  if(isAilos){
    const matches=[...text.matchAll(/(\d{2})\s+(JAN|FEV|MAR|ABR|MAI|JUN|JUL|AGO|SET|OUT|NOV|DEZ)\s+([^R\n]{3,60}?)\s+R\$\s*([\d.]+,\d{2})/gi)];
    for(const m of matches){
      const amount=parseFloat(m[4].replace(/\./g,"").replace(",","."));
      const title=m[3].replace(/\s{2,}/g," ").trim();
      if(!isNaN(amount)&&amount>0&&title.length>1)
        txns.push({date:`${year}-${ptNum[m[2].toUpperCase()]||"01"}-${m[1].padStart(2,"0")}`,title,amount,card,month:monthLabel,category:categorize(title)});
    }
  }
  if(isInter){
    const ptM={jan:"01",fev:"02",mar:"03",abr:"04",mai:"05",jun:"06",jul:"07",ago:"08",set:"09",out:"10",nov:"11",dez:"12"};
    const matches=[...text.matchAll(/(\d{2})\s+de\s+(\w+)\.\s+(\d{4})\s+([^\n]+?)\s+([\d.]+,\d{2})/gi)];
    for(const m of matches){
      const mon=ptM[m[2].toLowerCase().slice(0,3)]||"01";
      const amount=parseFloat(m[5].replace(/\./g,"").replace(",","."));
      const title=m[4].trim().replace(/[-–]\s*$/,"").trim();
      if(!isNaN(amount)&&amount>0&&title.length>1&&!title.match(/LEANDRO|VENCIMENTO|VALOR/i))
        txns.push({date:`${m[3]}-${mon}-${m[1].padStart(2,"0")}`,title,amount,card,month:monthLabel,category:categorize(title)});
    }
  }
  return txns;
}

async function processFile(file){
  if(file.name.toLowerCase().endsWith(".csv")){const text=await file.text();return parseCSV(text,file.name);}
  if(file.name.toLowerCase().endsWith(".pdf")) return parsePDF(file);
  return [];
}

// ─── UPLOAD SCREEN ────────────────────────────
function UploadScreen({onLoad}) {
  const [files,setFiles]=useState([]);
  const [loading,setLoading]=useState(false);
  const [progress,setProgress]=useState("");
  const inputRef=useRef();

  const addFiles=raw=>{
    const valid=Array.from(raw).filter(f=>f.name.endsWith(".csv")||f.name.endsWith(".pdf"));
    setFiles(prev=>{const names=new Set(prev.map(f=>f.name));return [...prev,...valid.filter(f=>!names.has(f.name))];});
  };

  const handleProcess=async()=>{
    if(!files.length) return;
    setLoading(true);
    const all=[];
    for(const file of files){
      setProgress(`Lendo ${file.name}…`);
      try{all.push(...(await processFile(file)));}catch(e){console.error(e);}
    }
    setLoading(false); setProgress("");
    onLoad(all,files.map(f=>f.name));
  };

  const guessCard=name=>{
    const n=name.toLowerCase();
    if(n.includes("nubank")) return {label:"Nubank",color:"#8c52ff"};
    if(n.includes("inter"))  return {label:"Inter", color:"#ff6b00"};
    if(n.includes("fatura_")||n.includes("ailos")) return {label:"Ailos",color:"#00a86b"};
    return {label:"PDF/CSV",color:"#64748b"};
  };

  return (
    <div style={{minHeight:"100dvh",background:"#080810",display:"flex",flexDirection:"column",fontFamily:"'DM Mono',monospace",padding:"env(safe-area-inset-top,0px) 20px 32px",overflowY:"auto"}}>
      <div className="fade-up" style={{width:"100%",maxWidth:480,margin:"auto",paddingTop:40}}>

        {/* Header */}
        <div style={{textAlign:"center",marginBottom:32}}>
          <div style={{fontSize:48,marginBottom:10}}>💳</div>
          <h1 style={{fontFamily:"'Syne',sans-serif",fontSize:26,fontWeight:800,color:"#f1f5f9",margin:"0 0 6px",letterSpacing:"-0.03em"}}>
            Dashboard Financeiro
          </h1>
          <p style={{color:"#334155",fontSize:11,letterSpacing:"0.06em"}}>
            ANÁLISE DE CARTÕES DE CRÉDITO
          </p>
        </div>

        {/* Upload button — mobile friendly big tap target */}
        <input ref={inputRef} type="file" multiple accept=".csv,.pdf" style={{display:"none"}} onChange={e=>addFiles(e.target.files)}/>
        <div className="tap-target btn-tap"
          onClick={()=>inputRef.current?.click()}
          style={{width:"100%",padding:"28px 20px",borderRadius:20,border:"2px dashed #1e293b",background:"#0c0c18",cursor:"pointer",marginBottom:12,display:"flex",flexDirection:"column",alignItems:"center",gap:8}}>
          <span style={{fontSize:32}}>📁</span>
          <span style={{color:"#cbd5e1",fontSize:14,fontWeight:500}}>Selecionar arquivos</span>
          <span style={{color:"#334155",fontSize:11}}>.CSV (Nubank) · .PDF (Ailos / Inter)</span>
        </div>

        {/* File list */}
        {files.length>0&&(
          <div style={{background:"#0c0c18",border:"1px solid #0f172a",borderRadius:16,overflow:"hidden",marginBottom:16}}>
            <div style={{padding:"10px 16px",borderBottom:"1px solid #0f172a",fontSize:10,color:"#334155",letterSpacing:"0.08em"}}>
              {files.length} ARQUIVO{files.length>1?"S":""} SELECIONADO{files.length>1?"S":""}
            </div>
            {files.map((f,i)=>{
              const card=guessCard(f.name);
              return (
                <div key={i} style={{display:"flex",alignItems:"center",gap:10,padding:"12px 16px",borderBottom:i<files.length-1?"1px solid #0a0a14":"none"}}>
                  <span style={{fontSize:20}}>{f.name.endsWith(".pdf")?"📄":"📊"}</span>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:11,color:"#94a3b8",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{f.name}</div>
                    <div style={{fontSize:10,color:"#334155",marginTop:2}}>{(f.size/1024).toFixed(0)} KB</div>
                  </div>
                  <span style={{fontSize:10,padding:"3px 9px",borderRadius:99,background:card.color+"22",color:card.color,border:`1px solid ${card.color}44`,flexShrink:0}}>{card.label}</span>
                  <button onClick={()=>setFiles(p=>p.filter(x=>x.name!==f.name))}
                    style={{background:"none",border:"none",color:"#ef4444",cursor:"pointer",fontSize:18,padding:"4px 6px",lineHeight:1,flexShrink:0}}>✕</button>
                </div>
              );
            })}
          </div>
        )}

        {/* Cards guide */}
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:20}}>
          {[
            {icon:"🟣",label:"Nubank",  desc:"CSV pelo app",   color:"#8c52ff"},
            {icon:"🟢",label:"Ailos",   desc:"Fatura PDF",     color:"#00a86b"},
            {icon:"🟠",label:"Inter",   desc:"Fatura PDF",     color:"#ff6b00"},
          ].map(b=>(
            <div key={b.label} style={{background:"#0c0c18",border:`1px solid ${b.color}22`,borderRadius:12,padding:"12px 10px",textAlign:"center"}}>
              <div style={{fontSize:16,marginBottom:4}}>{b.icon}</div>
              <div style={{fontSize:11,color:b.color,fontWeight:600,marginBottom:2}}>{b.label}</div>
              <div style={{fontSize:9,color:"#334155"}}>{b.desc}</div>
            </div>
          ))}
        </div>

        {/* CTA */}
        <button className="tap-target btn-tap"
          onClick={handleProcess} disabled={files.length===0||loading}
          style={{width:"100%",padding:"16px 0",borderRadius:14,border:"none",background:files.length>0&&!loading?"linear-gradient(135deg,#4f46e5,#7c3aed)":"#0f172a",color:files.length>0&&!loading?"#fff":"#1e293b",fontSize:14,cursor:files.length>0&&!loading?"pointer":"not-allowed",letterSpacing:"0.04em"}}>
          {loading?(
            <span style={{display:"flex",alignItems:"center",justifyContent:"center",gap:10}}>
              <span style={{width:14,height:14,border:"2px solid #ffffff33",borderTopColor:"#fff",borderRadius:"50%",display:"inline-block",animation:"spin .7s linear infinite"}}/>
              <span className="pulse">{progress||"Processando…"}</span>
            </span>
          ):files.length===0?"Selecione ao menos um arquivo":`Analisar ${files.length} arquivo${files.length>1?"s":""} →`}
        </button>

        <p style={{textAlign:"center",color:"#1e293b",fontSize:10,marginTop:14}}>
          🔒 100% local · seus dados não saem do dispositivo
        </p>
      </div>
    </div>
  );
}

// ─── FILTER DRAWER ────────────────────────────
function FilterDrawer({open,onClose,cards,months,allCats,selectedCard,selectedMonth,categoryFilter,search,setSelectedCard,setSelectedMonth,setCategoryFilter,setSearch}) {
  if(!open) return null;
  const hasFilter=!!search||selectedCard!=="all"||selectedMonth!=="all"||categoryFilter!=="all";
  return (
    <>
      <div className="drawer-overlay" onClick={onClose}/>
      <div className="drawer">
        <div className="drawer-handle"/>
        <div style={{padding:"0 20px 20px"}}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:20}}>
            <span style={{fontFamily:"'Syne',sans-serif",fontSize:15,fontWeight:700,color:"#f1f5f9"}}>Filtros</span>
            {hasFilter&&(
              <button onClick={()=>{setSearch("");setSelectedCard("all");setSelectedMonth("all");setCategoryFilter("all");}}
                style={{background:"#ef444420",border:"1px solid #ef444440",color:"#ef4444",borderRadius:8,padding:"5px 10px",fontSize:11,cursor:"pointer"}}>
                Limpar tudo
              </button>
            )}
          </div>

          {/* Search */}

// ─── DASHBOARD ───────────────────────────────
function Dashboard({transactions,fileNames,onReset}){
  const [activeTab,      setActiveTab]      = useState("overview");
  const [selectedCard,   setSelectedCard]   = useState("all");
  const [selectedMonth,  setSelectedMonth]  = useState("all");
  const [search,         setSearch]         = useState("");
  const [categoryFilter, setCategoryFilter] = useState("all");
  const [sortBy,         setSortBy]         = useState("date");
  const [sortDir,        setSortDir]        = useState("desc");
  const [filterOpen,     setFilterOpen]     = useState(false);

  const cards       = useMemo(()=>["all",...new Set(transactions.map(t=>t.card))],[transactions]);
  const months      = useMemo(()=>{
    const parseMonth=s=>{const p=s.match(/(\w+)\/(\d{4})/);if(!p)return 0;const mo={jan:1,fev:2,mar:3,abr:4,mai:5,jun:6,jul:7,ago:8,set:9,out:10,nov:11,dez:12};return parseInt(p[2])*100+(mo[p[1].toLowerCase().slice(0,3)]||0);};
    const unique=[...new Set(transactions.map(t=>t.month))].sort((a,b)=>parseMonth(a)-parseMonth(b));
    return ["all",...unique];
  },[transactions]);
  const allCats     = ["all",...Object.keys(CAT_COLORS)];
  const uniqueCards = useMemo(()=>[...new Set(transactions.map(t=>t.card))],[transactions]);

  const filtered = useMemo(()=>transactions.filter(t=>{
    if(selectedCard!=="all"&&t.card!==selectedCard) return false;
    if(selectedMonth!=="all"&&t.month!==selectedMonth) return false;
    if(categoryFilter!=="all"&&t.category!==categoryFilter) return false;
    if(search&&!t.title.toLowerCase().includes(search.toLowerCase())) return false;
    return true;
  }).sort((a,b)=>{
    if(sortBy==="amount"){
      const diff=Math.abs(a.amount)-Math.abs(b.amount);
      return sortDir==="desc"?-diff:diff;
    }
    if(sortBy==="date"){
      const diff=a.date.localeCompare(b.date);
      return sortDir==="desc"?-diff:diff;
    }
    const diff=String(a[sortBy]).localeCompare(String(b[sortBy]));
    return sortDir==="desc"?-diff:diff;
  }),[transactions,selectedCard,selectedMonth,categoryFilter,search,sortBy,sortDir]);

  const expenses = useMemo(()=>filtered.filter(t=>t.amount>0&&t.category!=="Pagamento"&&t.category!=="Encargos/Juros"),[filtered]);
  const totalExp    = useMemo(()=>expenses.reduce((s,t)=>s+t.amount,0),[expenses]);
  const totalCharge = useMemo(()=>filtered.filter(t=>t.category==="Encargos/Juros"&&t.amount>0).reduce((s,t)=>s+t.amount,0),[filtered]);
  const totalPay    = useMemo(()=>filtered.filter(t=>t.amount<0).reduce((s,t)=>s+Math.abs(t.amount),0),[filtered]);

  const catBreakdown = useMemo(()=>{
    const map={};
    expenses.forEach(t=>{map[t.category]=(map[t.category]||0)+t.amount;});
    return Object.entries(map).map(([name,value])=>({name,value:+value.toFixed(2)})).sort((a,b)=>b.value-a.value);
  },[expenses]);

  const monthlyTrend = useMemo(()=>{
    const map={};
    filtered.filter(t=>t.amount>0&&t.category!=="Pagamento"&&t.category!=="Encargos/Juros").forEach(t=>{
      if(!map[t.month]) map[t.month]={month:t.month,total:0};
      map[t.month].total+=t.amount;
      map[t.month][t.card]=(map[t.month][t.card]||0)+t.amount;
    });
    return Object.values(map)
      .map(m=>({...m,total:+m.total.toFixed(2)}))
      .sort((a,b)=>{
        const parse=s=>{const p=s.match(/(\w+)\/(\d{4})/);if(!p)return 0;const months={jan:1,fev:2,mar:3,abr:4,mai:5,jun:6,jul:7,ago:8,set:9,out:10,nov:11,dez:12};return parseInt(p[2])*100+(months[p[1].toLowerCase().slice(0,3)]||0);};
        return parse(a.month)-parse(b.month);
      });
  },[filtered]);

  const topMerchants = useMemo(()=>{
    const map={};
    expenses.forEach(t=>{
      const key=t.title.replace(/ - Parcela \d+\/\d+/g,"").trim();
      if(!map[key]) map[key]={name:key,total:0,count:0};
      map[key].total+=t.amount; map[key].count++;
    });
    return Object.values(map).sort((a,b)=>b.total-a.total).slice(0,10).map(m=>({...m,total:+m.total.toFixed(2)}));
  },[expenses]);

  const cardStats = useMemo(()=>uniqueCards.map(card=>{
    const txns=filtered.filter(t=>t.card===card&&t.amount>0&&t.category!=="Pagamento"&&t.category!=="Encargos/Juros");
    return {card,total:txns.reduce((s,t)=>s+t.amount,0),count:txns.length};
  }),[filtered,uniqueCards]);

  const toggleSort=field=>{
    if(sortBy===field) setSortDir(d=>d==="desc"?"asc":"desc");
    else{setSortBy(field);setSortDir("desc");}
  };

  const hasFilter=!!search||selectedCard!=="all"||selectedMonth!=="all"||categoryFilter!=="all";

  const TABS=[
    {id:"overview",  icon:"📊", label:"Visão"},
    {id:"transactions",icon:"📋",label:"Gastos"},
    {id:"categories",icon:"🗂️", label:"Categorias"},
    {id:"trends",    icon:"📈", label:"Tendências"},
  ];

  return (
    <div style={{fontFamily:"'DM Mono',monospace",background:"#080810",minHeight:"100dvh",color:"#e2e8f0",
      paddingBottom:`calc(70px + env(safe-area-inset-bottom,0px))`}}>

      {/* Top header */}
      <div style={{background:"#0a0a14",borderBottom:"1px solid #0f172a",padding:"12px 16px",
        paddingTop:`calc(12px + env(safe-area-inset-top,0px))`,
        position:"sticky",top:0,zIndex:100}}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <div style={{flex:1}}>
            <div style={{fontFamily:"'Syne',sans-serif",fontSize:16,fontWeight:800,color:"#f1f5f9",letterSpacing:"-0.02em"}}>
              💳 Dashboard
            </div>
            <div style={{fontSize:9,color:"#1e293b",marginTop:1}}>{transactions.length} transações · {fileNames.length} arquivo{fileNames.length>1?"s":""}</div>
          </div>

          {/* Filter button */}
          <button className="tap-target" onClick={()=>setFilterOpen(true)}
            style={{display:"flex",alignItems:"center",gap:6,padding:"8px 12px",borderRadius:10,
              border:`1px solid ${hasFilter?"#4f46e5":"#1e293b"}`,
              background:hasFilter?"#4f46e522":"transparent",
              color:hasFilter?"#818cf8":"#475569",fontSize:12,cursor:"pointer"}}>
            <span>⚙️</span>
            <span>{hasFilter?"Filtros ativos":"Filtrar"}</span>
            {hasFilter&&<span style={{background:"#818cf8",color:"#fff",borderRadius:99,fontSize:9,padding:"1px 5px",lineHeight:1.4}}>
              {[search,selectedCard!=="all",selectedMonth!=="all",categoryFilter!=="all"].filter(Boolean).length}
            </span>}
          </button>

          {/* Reset */}
          <button className="tap-target" onClick={onReset}
            style={{padding:"8px",borderRadius:10,border:"1px solid #1e293b",background:"transparent",color:"#334155",fontSize:14,cursor:"pointer",lineHeight:1}}>
            ⬆️
          </button>
        </div>

        {/* Active filter chips */}
        {hasFilter&&(
          <div className="chip-scroll" style={{marginTop:8}}>
            {search&&<span className="chip active" onClick={()=>setSearch("")}>"{search}" ✕</span>}
            {selectedCard!=="all"&&<span className="chip active" onClick={()=>setSelectedCard("all")}>{selectedCard} ✕</span>}
            {selectedMonth!=="all"&&<span className="chip active" onClick={()=>setSelectedMonth("all")}>{selectedMonth} ✕</span>}
            {categoryFilter!=="all"&&<span className="chip active" onClick={()=>setCategoryFilter("all")}>{categoryFilter} ✕</span>}
          </div>
        )}
      </div>

      {/* Scrollable content */}
      <div style={{padding:"16px 16px 0"}} className="fade-up">
        {activeTab==="overview"&&(
          <OverviewTab filtered={filtered} transactions={transactions} expenses={expenses}
            totalExp={totalExp} totalCharge={totalCharge} totalPay={totalPay}
            catBreakdown={catBreakdown} topMerchants={topMerchants} cardStats={cardStats}
            setCategoryFilter={setCategoryFilter} setSelectedCard={setSelectedCard}
            selectedCard={selectedCard} setActiveTab={setActiveTab}/>
        )}
        {activeTab==="transactions"&&(
          <TransactionsTab filtered={filtered} sortBy={sortBy} sortDir={sortDir} toggleSort={toggleSort}/>
        )}
        {activeTab==="categories"&&(
          <CategoriesTab catBreakdown={catBreakdown} expenses={expenses} totalExp={totalExp}
            setCategoryFilter={setCategoryFilter} setActiveTab={setActiveTab}/>
        )}
        {activeTab==="trends"&&(
          <TrendsTab filtered={filtered} monthlyTrend={monthlyTrend}
            catBreakdown={catBreakdown} uniqueCards={uniqueCards}/>
        )}
      </div>

      {/* Bottom navigation */}
      <nav className="bottom-nav">
        {TABS.map(tab=>(
          <button key={tab.id} className={`nav-btn tap-target${activeTab===tab.id?" active":""}`}
            onClick={()=>setActiveTab(tab.id)}>
            <span className="icon">{tab.icon}</span>
            <span>{tab.label}</span>
          </button>
        ))}
      </nav>

      {/* Filter drawer */}
      <FilterDrawer
        open={filterOpen} onClose={()=>setFilterOpen(false)}
        cards={cards} months={months} allCats={allCats}
        selectedCard={selectedCard} selectedMonth={selectedMonth}
        categoryFilter={categoryFilter} search={search}
        setSelectedCard={setSelectedCard} setSelectedMonth={setSelectedMonth}
        setCategoryFilter={setCategoryFilter} setSearch={setSearch}
      />
    </div>
  );
}

// ─── ROOT ─────────────────────────────────────
function App(){
  const [transactions,setTransactions]=useState(null);
  const [fileNames,setFileNames]=useState([]);

  const handleLoad=(txns,names)=>{
    if(!txns||txns.length===0){
      alert("Nenhuma transação encontrada nos arquivos. Verifique se os arquivos são válidos (CSV Nubank ou PDF Ailos/Inter).");
      return;
    }
    setTransactions(txns);
    setFileNames(names);
  };

  if(!transactions)
    return <UploadScreen onLoad={handleLoad}/>;
  return <Dashboard transactions={transactions} fileNames={fileNames}
    onReset={()=>{setTransactions(null);setFileNames([]);}} />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
